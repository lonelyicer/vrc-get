[package]
name = "tauri-specta"
version = "2.0.0-rc.25"
edition = "2024"
description = "Completely typesafe Tauri commands (vendored: allows Tauri 3.0 alpha)"
license = "MIT"
repository = "https://github.com/specta-rs/tauri-specta"

[features]
default = []
derive = ["dep:tauri-specta-macros"]
javascript = ["dep:specta-typescript"]
typescript = ["dep:specta-typescript"]

[lib]
name = "tauri_specta"
path = "src/lib.rs"

[dependencies]
heck = "0.5"
paste = "1"
serde = "1"
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-serde = "0.0.12"
specta-typescript = { version = "0.0.12", optional = true }
specta-util = "0.0.12"
tauri = { version = "3.0.0-alpha.6", default-features = false, features = ["specta"] }
tauri-specta-macros = { version = "=2.0.0-rc.25", optional = true }
thiserror = "2"
